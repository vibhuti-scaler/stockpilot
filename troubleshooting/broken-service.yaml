# Scenario 2: Service with no endpoints
# The selector matches no Pod labels, so the Service has an empty Endpoints list
# and every request to it fails. Compare the selector with `kubectl get pods --show-labels`.
apiVersion: v1
kind: Service
metadata:
  name: stockpilot-broken-service
  namespace: stockpilot
  labels:
    lab: troubleshooting
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stockpilot
    app.kubernetes.io/component: backend-typo   # correct value: backend
  ports:
    - port: 8000
      targetPort: 8000
