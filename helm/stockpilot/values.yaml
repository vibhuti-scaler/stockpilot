# Default values for the StockPilot chart.
# Override per environment with values-dev.yaml / values-prod.yaml or --set.

nameOverride: ""
fullnameOverride: ""

image:
  pullPolicy: IfNotPresent
imagePullSecrets: []
#  - name: ghcr-pull-secret

backend:
  image: ghcr.io/vibhuti-scaler/stockpilot-backend
  tag: latest            # CI overrides this with the Git commit SHA
  replicaCount: 2
  port: 8000
  seedDemoData: false    # load demo suppliers/products on first start
  logLevel: info
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  probes:
    readiness: {path: /ready, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
    liveness: {path: /health, initialDelaySeconds: 15, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 3}
    startupFailureThreshold: 36   # 36 x 5s = up to 3 minutes for DB wait + migrations
  extraEnv: []

frontend:
  image: ghcr.io/vibhuti-scaler/stockpilot-frontend
  tag: latest
  replicaCount: 2
  port: 8080             # nginx-unprivileged listens on 8080; the Service exposes 80
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

postgres:
  enabled: true          # set false to point the backend at a managed database (e.g. Amazon RDS)
  image: postgres:17-alpine
  host: ""               # only used when enabled=false
  port: 5432
  database: stockpilot
  username: stockpilot
  password: stockpilot   # override: --set postgres.password=... or use existingSecret
  existingSecret: ""     # secret with keys POSTGRES_USER / POSTGRES_PASSWORD
  storage: 2Gi
  storageClassName: ""   # "" = cluster default StorageClass
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

service:
  type: ClusterIP

ingress:
  enabled: false
  className: nginx
  host: stockpilot.local
  annotations: {}
  tls: []
  #  - secretName: stockpilot-tls
  #    hosts: [stockpilot.example.com]

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
    labels:
      release: kube-prometheus-stack   # must match the Prometheus Operator's serviceMonitorSelector

podAnnotations: {}
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
