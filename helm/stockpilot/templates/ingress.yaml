{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stockpilot.fullname" . }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API traffic goes straight to FastAPI
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "stockpilot.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.port }}
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "stockpilot.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.port }}
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: {{ include "stockpilot.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.port }}
          # Everything else is the React single-page app
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "stockpilot.frontend.fullname" . }}
                port:
                  number: 80
{{- end }}
