apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.backend.fullname" . }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  APP_NAME: "StockPilot API"
  LOG_LEVEL: {{ .Values.backend.logLevel | quote }}
  SEED_DEMO_DATA: {{ .Values.backend.seedDemoData | quote }}
  CORS_ORIGINS: "*"
