name: StockPilot CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stockpilot-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stockpilot-frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Stage 1 - quality gate: lint + unit tests + frontend build.
  # If anything here fails, no image is built or pushed.
  # --------------------------------------------------------------------------
  test:
    name: Test & build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        working-directory: backend
        run: pytest -v --cov=app --cov-report=term-missing --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Validate Helm chart
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint helm/stockpilot
          helm lint helm/stockpilot -f helm/stockpilot/values-prod.yaml
          helm template stockpilot helm/stockpilot -f helm/stockpilot/values-prod.yaml > /dev/null

  # --------------------------------------------------------------------------
  # Stage 2 - build both images, scan them with Trivy, push to GHCR.
  # Tags: the full Git SHA (traceability) plus a short SHA; never only "latest".
  # --------------------------------------------------------------------------
  build-scan-push:
    name: Build, scan & push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # ---- DevSecOps gate: fail the pipeline on HIGH/CRITICAL vulnerabilities ----
      - name: Trivy scan - backend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan - frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy SARIF report (GitHub Security tab)
        uses: aquasecurity/trivy-action@0.33.1
        if: always()
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        with:
          sarif_file: trivy-backend.sarif

      - name: Push images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          for IMAGE in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:sha-$SHORT_SHA"
            docker push "$IMAGE:${{ github.sha }}"
            docker push "$IMAGE:sha-$SHORT_SHA"
          done
          echo "### Images published" >> "$GITHUB_STEP_SUMMARY"
          echo "- $BACKEND_IMAGE:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- $FRONTEND_IMAGE:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Stage 3 - deploy the exact SHA-tagged images with Helm.
  # Requires the KUBE_CONFIG_DATA secret (base64 kubeconfig of the EKS cluster).
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy with Helm
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.INGRESS_HOST || 'stockpilot.example.com' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment credentials
        id: creds
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KUBE_CONFIG_DATA secret not set - skipping deployment"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Helm
        if: steps.creds.outputs.configured == 'true'
        uses: azure/setup-helm@v5

      - name: Configure kubectl
        if: steps.creds.outputs.configured == 'true'
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Create namespace and GHCR pull secret
        if: steps.creds.outputs.configured == 'true'
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace stockpilot \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        if: steps.creds.outputs.configured == 'true'
        run: |
          helm upgrade --install stockpilot ./helm/stockpilot \
            --namespace stockpilot \
            --create-namespace \
            -f helm/stockpilot/values-prod.yaml \
            --set backend.image=$BACKEND_IMAGE \
            --set backend.tag=${{ needs.build-scan-push.outputs.image_tag }} \
            --set frontend.image=$FRONTEND_IMAGE \
            --set frontend.tag=${{ needs.build-scan-push.outputs.image_tag }} \
            --set ingress.host=${{ vars.INGRESS_HOST || 'stockpilot.example.com' }} \
            --set-string imagePullSecrets[0].name=ghcr-pull-secret \
            --wait --timeout 5m

      - name: Verify rollout
        if: steps.creds.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/stockpilot-backend -n stockpilot --timeout=180s
          kubectl rollout status deployment/stockpilot-frontend -n stockpilot --timeout=180s
          kubectl get pods,svc,ingress,hpa -n stockpilot
          helm list -n stockpilot
